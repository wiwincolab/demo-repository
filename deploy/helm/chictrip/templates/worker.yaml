# 生成佇列：跟 api 用同一個映像，CHICTRIP_ROLE=worker 時另外啟動 BullMQ worker（frontend/server/plugins/worker.ts）。
# 只能一個：worker 啟動時會把 running 的工作當成上一個 worker 留下的、放回佇列重做
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "chictrip.labels" . | nindent 4 }}
spec:
  replicas: 1
  # 新舊 worker 不能同時跑（上面的原因），先停舊的再開新的
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        {{- include "chictrip.configChecksum" . | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.api }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CHICTRIP_ROLE
              value: worker
            {{- include "chictrip.appEnv" . | nindent 12 }}
          envFrom:
            {{- include "chictrip.aiEnvFrom" . | nindent 12 }}
          # worker 也開著 HTTP：/health 通過代表它連得到資料庫
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
          volumeMounts:
            - name: media
              mountPath: /data/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
