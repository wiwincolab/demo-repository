function openImage(source,item){document.querySelector('#large').src=item.image;document.querySelector('#large').alt=source.title+' · '+item.name;document.querySelector('#image-title').textContent=source.title+' · '+item.name;document.querySelector('#original-link').href=item.image;document.querySelector('#prompt').textContent=item.prompt||'原照／既有定案素材。';document.querySelector('#prompt-details').open=false;viewer.showModal()}
function draw(){const host=document.querySelector('#gallery');host.replaceChildren();let count=0;for(const s of m.sources){if(trip.value!=='all'&&s.trip!==trip.value)continue;if(search.value&&!((s.title+' '+s.id+' '+s.label).toLowerCase().includes(search.value.toLowerCase())))continue;count++;const section=el('section');section.append(el('h2',s.title));const meta=el('div',(s.trip==='kansai'?'關西':'2025 重遊')+' · '+s.id+' · 原照 '+s.source);meta.className='source-meta';section.append(meta);const grid=el('div');grid.className='grid';const jobs=m.jobs.filter(j=>j.sourceId===s.id&&(style.value==='all'||j.style===style.value));const items=[{image:s.original,name:'原照',status:'source'},...jobs];for(const item of items){const fig=el('figure'),button=el('button');button.type='button';button.setAttribute('aria-label','放大 '+s.title+' '+item.name);if(item.status==='pending'){button.disabled=true;const missing=el('div','生成未完成');missing.className='missing';button.append(missing)}else{const img=el('img');img.src='previews/'+s.id+'/'+(item.status==='source'?'original':item.style)+'.jpg';img.alt=s.title+' '+item.name;img.loading='lazy';button.append(img);button.addEventListener('click',()=>openImage(s,item))}const caption=el('figcaption',item.name);caption.append(el('small',item.status==='source'?'來源照片':item.status==='preserved'?'沿用定案':item.status==='generated'?'新生成 PNG':'待補'));fig.append(button,caption);grid.append(fig)}section.append(grid);host.append(section)}document.querySelector('#count').textContent=count+' 組原照 · '+m.jobs.filter(j=>j.status!=='pending').length+' / '+m.jobs.length+' 作品'}
trip.addEventListener('change',draw);style.addEventListener('change',draw);search.addEventListener('input',draw);document.querySelector('#close').addEventListener('click',()=>viewer.close());viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});draw();
</script></html>
