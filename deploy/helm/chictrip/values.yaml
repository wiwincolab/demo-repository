# 部署流程用 --set image.tag=<commit SHA> 指定這次的版本，每一版都對得回原始碼
image:
  api: ghcr.io/wiwincolab/chictrip-api
  web: ghcr.io/wiwincolab/chictrip-web
  tag: latest
  # GHCR 是私有的，映像由部署流程用短期 token 先拉進 K3s；這裡不能設 Always，否則 pod 會自己去映像庫拉而失敗
  pullPolicy: IfNotPresent

# 對外網址（chictrip.jamessu2016.com）的 Ingress 不在這個 chart 裡，由 deploy/setup-vm.sh 用管理員權限建立：
# repo 是公開的，部署帳號若能建 Ingress，就能把 CARE 的網域導走

db:
  # 跟 MEDDEMO 同一個映像，care-vm 上已經有，不必再下載
  image: pgvector/pgvector:0.8.0-pg16
  # K3s 內建的 local-path 不會強制這個上限，資料直接放在 VM 的磁碟上；這裡只是宣告
  storage: 5Gi

redis:
  # 跟 MEDDEMO 同一個映像，VM 上已經有
  image: redis:8.10.1-alpine

# 評審上傳的照片與生成的圖（api、worker 共用）。一張照片縮圖後約 0.5 MB、生成圖約 1 MB；
# 跟 db 一樣，local-path 不強制上限
media:
  storage: 10Gi

# 程式參數：改這裡、commit、推 main 就會部署生效（跟 MEDDEMO 一樣）。
# 這裡寫什麼鍵，ConfigMap 就產生同名的環境變數（server/utils/config.ts 讀），留空＝用程式裡的預設值。
# 金鑰不放這裡，放 GitHub Secrets（見下面的 secrets）
config:
  # 生圖：gemini-3.1-flash-lite-image 與 gemini-nano-banana-2.1 都是 1K 一張 US$0.0336（Gemini 官方定價頁）
  IMAGE_MODEL: gemini-3.1-flash-lite-image
  # 生圖前先看照片、填 prompt 範本的空格
  TEXT_MODEL: gemini-3.5-flash-lite
  # 每台手機、全站每天能生成幾張（台北時間午夜重置）。全站 1,000 張約 US$34，是一天花費的上限
  DEVICE_DAILY_LIMIT: "20"
  GLOBAL_DAILY_LIMIT: "1000"
  # worker 同時處理幾件
  WORKER_CONCURRENCY: "4"
  # 單次 Gemini 呼叫的逾時，以及排隊超過多久就改顯示預製圖（毫秒）
  JOB_TIMEOUT_MS: "90000"
  QUEUE_STALE_MS: "300000"

# Secret 由部署流程從 GitHub Secrets 建立，不放進 chart（跟 MEDDEMO 一樣）
secrets:
  # POSTGRES_PASSWORD
  database: chictrip-secrets
  # GEMINI_API_KEY；還沒建時照樣啟動，生成一律退回預製圖
  ai: chictrip-ai
