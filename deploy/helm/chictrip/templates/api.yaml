apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "chictrip.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "chictrip.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        {{- include "chictrip.configChecksum" . | nindent 8 }}
    spec:
      containers:
        # Nitro：/api、/health，以及沒有預先產生的頁面（首頁、404）
        - name: api
          image: "{{ .Values.image.api }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "chictrip.appEnv" . | nindent 12 }}
            {{- if .Values.poi.enabled }}
            - name: POI_DATA_DIR
              value: /data/poi
            {{- end }}
          envFrom:
            {{- include "chictrip.aiEnvFrom" . | nindent 12 }}
          ports:
            - containerPort: 3000
          # /health 會查資料庫，資料庫沒好、資料表升級沒跑完之前 api 不接流量
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
          volumeMounts:
            - name: media
              mountPath: /data/media
            {{- if .Values.poi.enabled }}
            - name: poi
              mountPath: /data/poi
              readOnly: true
            {{- end }}
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
        {{- if .Values.poi.enabled }}
        - name: poi
          persistentVolumeClaim:
            claimName: poi
        {{- end }}
