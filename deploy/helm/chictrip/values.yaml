# 部署流程用 --set image.tag=<commit SHA> 指定這次的版本，每一版都對得回原始碼
image:
  api: ghcr.io/wiwincolab/chictrip-api
  web: ghcr.io/wiwincolab/chictrip-web
  tag: latest
  # GHCR 是私有的，映像由部署流程用短期 token 先拉進 K3s；這裡不能設 Always，否則 pod 會自己去映像庫拉而失敗
  pullPolicy: IfNotPresent

# 對外網址（chictrip.jamessu2016.com）的 Ingress 不在這個 chart 裡，由 deploy/setup-vm.sh 用管理員權限建立：
# repo 是公開的，部署帳號若能建 Ingress，就能把 CARE 的網域導走

db:
  # 跟 MEDDEMO 同一個映像，care-vm 上已經有，不必再下載
  image: pgvector/pgvector:0.8.0-pg16
  # K3s 內建的 local-path 不會強制這個上限，資料直接放在 VM 的磁碟上；這裡只是宣告
  storage: 5Gi

redis:
  # 跟 MEDDEMO 同一個映像，VM 上已經有
  image: redis:8.10.1-alpine

# 評審上傳的照片與分享圖卡（api、worker 共用）。一張照片縮圖後約 0.5 MB；
# 跟 db 一樣，local-path 不強制上限
media:
  storage: 10Gi

# 兩個 Pod 共用 Redis 佇列；每個 Pod 的並行數由 WORKER_CONCURRENCY 決定。
# media 使用 local-path PVC，這些 Pod 必須留在 PVC 所在的同一台節點。
worker:
  replicas: 2
  terminationGracePeriodSeconds: 120
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Snapshot publication has its own short-lived Pod. Live requests only read JSON.
# Network refreshes use an explicit Job with poi.mode=import; no recurring public API crawl.
poi:
  enabled: true
  mode: publish
  runId: ""
  storage: 2Gi
  activeDeadlineSeconds: 10800
  overpassUrl: https://overpass-api.de/api/interpreter
  regions: ""
  stage: all
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# 程式參數：改這裡、commit、推 main 就會部署生效（跟 MEDDEMO 一樣）。
mapData:
  # Opt-in only; build Dockerfile.map-data with the same immutable image tag.
  enabled: false
  image: ghcr.io/wiwincolab/chictrip-map-data
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# 這裡寫什麼鍵，ConfigMap 就產生同名的環境變數（server/utils/config.ts 讀），留空＝用程式裡的預設值。
# 金鑰不放這裡，放 GitHub Secrets（見下面的 secrets）
config:
  # 貼文文案、eSIM 推薦理由、照片標類別、每日卡片。AI 創作的成品不生成，一律用預製圖或手機上合成的示範圖
  TEXT_MODEL: gemini-3.5-flash-lite
  # 每個 worker Pod 同時處理幾件；預設 2 × 4 = 8 件
  WORKER_CONCURRENCY: "4"
  # 每日卡片單次 Gemini 呼叫的逾時，以及排隊超過多久就退回不配文字的卡片（毫秒）
  JOB_TIMEOUT_MS: "90000"
  QUEUE_STALE_MS: "300000"

# Secret 由部署流程從 GitHub Secrets 建立，不放進 chart（跟 MEDDEMO 一樣）
secrets:
  # POSTGRES_PASSWORD
  database: chictrip-secrets
  # GEMINI_API_KEY；還沒建時照樣啟動，文案與每日卡片一律用範本
  ai: chictrip-ai
