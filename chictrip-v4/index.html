:root{--ink:#1F2733;--mute:#8A919C;--grey:#F2F3F5;--line:#E6E8EB;--blue:#3E9AF3;--blue-deep:#2B7FD6;--black:#1F2733;--orange:#F0922B;--peach:#FDEBD8;--gold:#E9A83A;--yellow:#F5C842;--green:#2FB36A;--red:#D93B1F}
*{box-sizing:border-box}
.stage{min-height:100vh;background:#E6E6E6;display:flex;justify-content:center;padding:16px 10px;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
.phone{width:100%;max-width:390px;height:820px;background:#fff;border-radius:40px;border:6px solid #1c1c1e;overflow:hidden;display:flex;flex-direction:column;position:relative;min-width:0}
.body{flex:1;overflow-y:auto;background:#fff}.body::-webkit-scrollbar{display:none}
.body.nopad{overflow:hidden}
.page{padding:14px clamp(12px,4.5vw,18px) 96px;display:flex;flex-direction:column;gap:12px;min-height:100%;position:relative}
.page.detail{padding-top:0}
.topicons{display:flex;justify-content:space-between;align-items:center;min-height:28px}.topicons.center{justify-content:center}.topicons.onimg{padding:12px 4px}
.relico{position:relative}.reddot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#E5484D}
.title{font-size:26px;font-weight:800;margin:0}.title.big{font-size:clamp(26px,8.6vw,34px)}.title.mid{font-size:18px;flex:1;text-align:center}
.hero{font-size:clamp(26px,8.6vw,34px);line-height:1.25;font-weight:900;margin:4px 0 6px;letter-spacing:-.01em}
.tilegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{min-width:0;background:var(--grey);border:0;border-radius:22px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:inherit;cursor:pointer;padding:0}
.tile.wide{grid-column:span 2;aspect-ratio:auto;background:linear-gradient(135deg,#F9D9A6,#F6C77E);position:relative;align-items:flex-start;justify-content:flex-start;padding:0;overflow:hidden}
.wide-tag{background:var(--orange);color:#fff;font-weight:800;font-size:clamp(13px,4vw,16px);padding:10px 12px;border-radius:22px 0 22px 0;white-space:nowrap}
.wide-deco{position:absolute;right:-10px;bottom:-16px;width:90px;height:90px;border-radius:50%;background:#F0922B;opacity:.35}
.tile-n{font-size:15px;font-weight:700}
.dots{display:flex;justify-content:center;gap:6px}.dots i{width:8px;height:8px;border-radius:4px;background:#D9DCE1}.dots i.on{width:22px;background:var(--ink)}
.locbanner{display:flex;align-items:center;gap:10px;background:var(--peach);border-radius:18px;padding:12px 12px;font-size:13px;line-height:1.5;min-width:0}.loc-t{min-width:0}
.loc-ico{color:var(--orange);display:flex}.loc-t b{color:var(--orange);font-weight:800}.loc-btn{background:#E27F1B;color:#fff;border:0;border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;font-weight:700;white-space:nowrap}
.planrow{display:flex;gap:10px;align-items:center;margin-top:4px}
.plan-h{font-size:22px;font-weight:900}.plan-s{font-size:14px;color:var(--mute);margin:2px 0 10px}
.blackpill{background:var(--black);color:#fff;border:0;border-radius:999px;padding:12px 22px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.linkline{display:block;background:none;border:0;color:var(--blue-deep);font:inherit;font-size:13px;font-weight:700;padding:8px 0 0;cursor:pointer;text-align:left}
.collage{width:150px;height:130px;display:grid;grid-template-columns:1fr 1fr;gap:6px;transform:rotate(-8deg);flex:0 0 auto}.collage i{border-radius:14px;display:block}
.sect-h{font-size:24px;font-weight:900;margin-top:8px}.sect-h.small{font-size:15px;color:var(--mute);font-weight:700;margin-top:4px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}.chiprow.pad{padding:0 16px}
.chip{background:var(--grey);border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff}.chip.big{padding:12px 18px;font-size:15px}
.toprow{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px}.toprow::-webkit-scrollbar{display:none}
.topcard{flex:0 0 150px;height:120px;border-radius:18px;position:relative}
.topbadge{position:absolute;left:10px;top:0;background:var(--yellow);font-size:11px;font-weight:900;line-height:1.1;padding:6px 8px 8px;border-radius:0 0 10px 10px;text-align:center}
.topheart{position:absolute;right:10px;top:10px;color:#fff}
.bluebtn{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:16px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;width:100%}

.phone{width:100%;max-width:390px;height:820px;background:#fff;border-radius:36px;border:6px solid #1c1c1e;overflow:hidden;display:flex;flex-direction:column;position:relative}
.statusbar{display:flex;justify-content:space-between;padding:10px 24px 4px;font-size:12px;font-weight:600}
.mapbox{position:relative;flex:0 0 auto}
.map{display:block;width:100%;height:auto}
.zoomrow{position:absolute;top:8px;right:8px;display:flex;gap:4px;background:rgba(255,255,255,.92);border-radius:999px;padding:3px}
.zoom{border:0;background:none;border-radius:999px;padding:4px 9px;font:inherit;font-size:11px;font-weight:700;color:var(--mute);cursor:pointer}
.zoom.on{background:var(--ink);color:#fff}
.sheet{flex:1;overflow-y:auto;background:var(--bg);border-top-left-radius:18px;border-top-right-radius:18px;margin-top:-14px;position:relative;box-shadow:0 -4px 12px rgba(0,0,0,.06)}
.sheet::-webkit-scrollbar{display:none}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:#D9D9D9;margin:8px auto 0}
.pad{padding:8px 14px 20px;display:flex;flex-direction:column;gap:10px}
.h1{font-size:22px;font-weight:700;margin:6px 0 4px}
.h2{font-size:15px;font-weight:700} .mt{margin-top:6px}
.hint{margin:0;font-size:12px;color:var(--mute);line-height:1.5}
.mute{color:var(--mute);font-weight:400;font-size:12px;margin-left:6px}
.primary{background:var(--orange);color:#fff;border:0;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.primary:disabled{background:#d9d9d9} .primary.done{background:var(--ok)}
.ghost{background:#fff;color:var(--orange);border:1.5px solid var(--orange);border-radius:12px;padding:12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;width:100%}
.ghost.half{width:auto;flex:1;padding:10px 6px;font-size:13px}
.linkbtn{background:none;border:0;color:var(--orange);font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-left:8px}
:where(button,input):focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.bigbtn{background:#fff;border:1.5px solid var(--orange);border-radius:16px;padding:16px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left}
.bigbtn.alt{border-style:dashed}
.bigbtn-t{font-size:17px;font-weight:700;color:var(--orange-deep)} .bigbtn-s{font-size:12px;color:var(--mute);line-height:1.5}
.plannav{display:flex;align-items:center;gap:4px;padding:6px 8px 0}
.navback{background:none;border:0;font-size:28px;line-height:1;padding:0 6px;cursor:pointer;color:var(--ink)}
.stepsrow{display:flex;gap:4px;overflow-x:auto;flex:1} .stepsrow::-webkit-scrollbar{display:none}
.stepb{flex:0 0 auto;border:0;background:none;border-radius:999px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer}
.stepb.on{background:var(--ink);color:#fff}
.navrow{display:flex;align-items:center;gap:8px} .navtitle{flex:1;text-align:center;font-weight:700;font-size:15px} .navspace{width:36px}
.opt{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;text-align:left;cursor:pointer;width:100%}
.opt.on{border-color:var(--orange);background:var(--orange-soft)}
.opt-t{font-size:14px;font-weight:700} .opt-s{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.45}
.row2{display:flex;align-items:center;gap:8px} .row2.between{justify-content:space-between}
.lbl{font-size:12px;color:var(--mute);white-space:nowrap}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer}
.pill.on{background:var(--orange);border-color:var(--orange);color:#fff}
.pill.big{padding:10px 16px;font-size:14px}
.range{width:100%;accent-color:var(--orange)}
.rangev{font-size:14px} .rangev b{color:var(--orange);font-size:18px}
.sumline{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px} .sumline b{color:var(--orange)}
.warn{color:var(--bad);font-weight:700;margin-left:8px}
.poi{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.poi.over{opacity:.55}
.poi-main{flex:1;min-width:0} .poi-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.poi-n{font-size:14px;font-weight:700} .poi-s{font-size:12px;color:var(--mute);margin-top:2px}
.tagst{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tagst.in{background:var(--orange-soft);color:var(--orange-deep)} .tagst.ok{background:#FFF7EE;color:#B8720F;border:1px dashed #F5B27A} .tagst.over{background:#eee;color:var(--mute)}
.hitt{color:var(--orange-deep);font-weight:600}
.caveat{margin-top:6px;font-size:12px;line-height:1.5;background:var(--bad-soft);color:#7A2A1C;border-radius:8px;padding:6px 8px}
.plus{margin-top:6px;font-size:12px;line-height:1.5;background:var(--ok-soft);color:#1B5E43;border-radius:8px;padding:6px 8px}
.addbtn{background:var(--orange-soft);color:var(--orange);border:0;border-radius:999px;padding:8px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.addbtn.on{background:var(--orange);color:#fff} .addbtn:disabled{background:#eee;color:#aaa;cursor:default}
.cmp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.cmp-h{display:grid;grid-template-columns:78px 1fr 1fr;gap:6px;margin-bottom:4px}
.cmp-c{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;line-height:1.3} .cmp-c small{font-weight:400;color:var(--mute)}
.cmp-c.on{background:var(--orange);color:#fff;border-color:var(--orange)} .cmp-c.on small{color:#fff}
.cmp-r{display:grid;grid-template-columns:78px 1fr 1fr;gap:6px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
.cmp-k{color:var(--mute)} .cmp-r .on{font-weight:700;color:var(--orange-deep)}
.tg{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px 4px 4px;font:inherit;font-size:12px;cursor:pointer;color:var(--mute)}
.tg-knob{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--line)} .tg.on{background:var(--orange);border-color:var(--orange);color:#fff}
.tg-txt{font-weight:700;min-width:20px;text-align:center}
.newt{color:var(--ok)} .oldt{color:var(--bad)}
.leg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.leg-k{font-size:12px;font-weight:700;color:var(--orange-deep)}
.fest{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fest.hit{border-color:#D93B1F;background:#FFF4F1}
.fest-h{display:flex;justify-content:space-between;align-items:baseline}
.okt{color:var(--ok);font-weight:700}
.check{font-size:13px;line-height:1.5;border-radius:12px;padding:10px 12px}
.check.ok{background:var(--ok-soft);color:#1B5E43} .check.bad{background:var(--bad-soft);color:#7A2A1C} .check.info{background:#fff;border:1px dashed var(--line);color:var(--ink)}
.sumbox{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.dayrow{display:grid;grid-template-columns:64px 1fr;gap:8px}
.day-h{font-size:13px;font-weight:700;display:flex;flex-direction:column} .day-h .mute{margin:0}
.day-b{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.stopl{font-size:14px;font-weight:600} .stopl.fire{color:#D93B1F} .stopl.bus{color:#5B33B0}
.alert{background:var(--bad-soft);border-radius:12px;padding:12px}
.alert-t{font-size:15px;font-weight:700;color:var(--bad)}
.gemt{font-size:11px;font-weight:700;color:#5B33B0;background:#EFE9FA;padding:2px 8px;border-radius:999px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w{font-size:11px;color:var(--mute);text-align:center}
.cal-d{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;font:inherit;font-size:12px;cursor:pointer}
.cal-d.wkend{color:var(--orange-deep)} .cal-d.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.tiers{display:flex;gap:6px}
.tier{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.tier.on{border-color:var(--orange);background:var(--orange-soft)}
.tier-n{font-size:14px;font-weight:700} .tier-p{font-size:12px;color:var(--orange-deep);font-weight:700}
.morning{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.morning-t{font-size:18px;font-weight:700}
.toast{position:sticky;top:6px;z-index:5;margin:0 14px;background:rgba(34,34,34,.92);color:#fff;font-size:13px;padding:9px 14px;border-radius:12px;text-align:center}

:root{--orange:#F5821F;--orange-soft:#FFF1E6;--orange-deep:#D96D10;--ink:#222;--mute:#8A8F98;--line:#EAEAEA;--bg:#F7F7F7;--slow:#C9CED4;--ok:#1E7F5C;--ok-soft:#E8F5EC}
*{box-sizing:border-box}
.stage{min-height:100vh;background:#E6E6E6;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 10px;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
.demobar{display:flex;background:#fff;border-radius:999px;padding:3px;border:1px solid #d9d9d9}
.seg{border:0;background:none;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer}
.seg.on{background:var(--ink);color:#fff}
.phone{width:100%;max-width:390px;height:820px;background:#fff;border-radius:36px;border:6px solid #1c1c1e;overflow:hidden;display:flex;flex-direction:column;position:relative}
.statusbar{display:flex;justify-content:space-between;padding:10px 24px 0;font-size:12px;font-weight:600}
.body{flex:1;overflow-y:auto;background:var(--bg)}
.body::-webkit-scrollbar{display:none}
.screen{padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.screen-trip{padding-top:0;padding-bottom:84px}
.pagehead{display:flex;justify-content:space-between;align-items:baseline;padding-top:6px}
.pagetitle{font-size:24px;font-weight:700;margin:0}
.linkbtn{background:none;border:0;color:var(--orange);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.sect{font-size:13px;color:var(--mute);margin-top:4px}
.lead{margin:0;font-size:13px;color:var(--mute);line-height:1.6}
.label{font-size:13px;color:var(--mute);margin-top:2px}
.primary{background:var(--orange);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.primary:active{background:var(--orange-deep)} .primary:disabled{background:#d9d9d9;cursor:default}
.primary.small{width:auto;padding:10px 16px;font-size:13px;white-space:nowrap} .primary.flex{flex:1}
.ghost{background:#fff;color:var(--orange);border:1.5px solid var(--orange);border-radius:12px;padding:14px 20px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.ghost.small{padding:8px 14px;font-size:13px}
:where(button,input,textarea):focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.tripcard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;width:100%;text-align:left;font:inherit;cursor:pointer;position:relative}
.tripcover{width:64px;height:64px;border-radius:10px;background:var(--cover);flex:0 0 auto}
.tripname{font-size:16px;font-weight:700} .tripdate{font-size:12px;color:var(--mute);margin-top:3px}

.rain{display:flex;gap:10px;align-items:center;background:#EEF3F8;border:1px solid #D6E2EE;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45}
.rain.on{background:var(--orange-soft);border-color:var(--orange)}
.rain-i{font-size:22px} .rain-t{flex:1}
.popup{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--orange);border-radius:14px;padding:12px}
.freebtn{background:#fff;border:1.5px dashed var(--orange);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;width:100%}
.freebtn-t{font-size:15px;font-weight:700;color:var(--orange-deep)} .freebtn-s{font-size:12px;color:var(--mute)}
.empty{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.cardwrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px}
.post-text{margin:0 0 8px;font-size:14px;line-height:1.6} .tags-text{color:var(--orange);font-size:13px}
.tabbar{display:flex;border-top:1px solid var(--line);background:#fff;padding:8px 0 14px}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:11px;color:var(--mute);cursor:pointer}
.tab-ico{width:22px;height:22px;border-radius:7px;background:var(--line)} .tab.on{color:var(--orange)} .tab.on .tab-ico{background:var(--orange)}
