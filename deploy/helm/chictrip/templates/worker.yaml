# 照片標類別與每日卡片的佇列：跟 api 用同一個映像，CHICTRIP_ROLE=worker 時另外啟動 BullMQ worker（frontend/server/plugins/worker.ts）。
# 一個就夠：只做照片標類別與每日卡片，不生圖
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "chictrip.labels" . | nindent 4 }}
spec:
  replicas: 1
  # 先停舊的再開新的；排隊中的每日卡片，新 worker 啟動時會從資料表接回來
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        {{- include "chictrip.configChecksum" . | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.api }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CHICTRIP_ROLE
              value: worker
            {{- include "chictrip.appEnv" . | nindent 12 }}
          envFrom:
            {{- include "chictrip.aiEnvFrom" . | nindent 12 }}
          # worker 也開著 HTTP：/health 通過代表它連得到資料庫
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
          volumeMounts:
            - name: media
              mountPath: /data/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
