apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "chictrip.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "chictrip.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        # Nitro：/api、/health，以及沒有預先產生的頁面（首頁、404）
        - name: api
          image: "{{ .Values.image.api }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "chictrip.databaseEnv" . | nindent 12 }}
          ports:
            - containerPort: 3000
          # /health 會查資料庫，資料庫沒好之前 api 不接流量
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
