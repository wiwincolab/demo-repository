# 反向代理：/api 與 /health 轉給 Nitro，其餘先找預先產生的靜態檔
server {
    listen 80;
    root /usr/share/nginx/html;
    # 上傳照片：Nginx 預設只收 1MB；手機會先縮到 1600px，後端上限 10MB（server/api/photos.post.ts），這裡留一點餘裕
    client_max_body_size 12m;

    # ES modules require a JavaScript MIME type; nginx's default map omits .mjs.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://api:3000;
    }

    # 預先產生的頁面是 /trips/index.html 這種形式；找不到靜態檔的網址（首頁、404）交給 Nitro 即時產生
    location / {
        try_files $uri $uri/index.html @nitro;
    }

    location @nitro {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }
}
