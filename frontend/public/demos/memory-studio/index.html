<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回憶製造所 · Demo</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#233b40;background:#f8faf9;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #199ec1;outline-offset:4px}button{color:inherit}header{height:78px;background:#fff;border-bottom:1px solid #e3eae7;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}header b{font-size:18px}header small{font-size:12px;color:#63807e;border:1px solid #dce7e2;border-radius:30px;padding:7px 12px}main{max-width:1160px;margin:auto;padding:45px 28px 60px}.eyebrow{font-size:11px;letter-spacing:2px;color:#60877c;font-weight:700}h1{font-size:38px;letter-spacing:-1px;margin:10px 0}p{color:#748781;font-size:14px;line-height:1.8;margin:0}h2{font-size:23px;margin:5px 0 7px}h3{font-size:17px;margin:0 0 5px}.heading{margin-bottom:36px}.section-heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:19px}.tag{font-size:11px;color:#66847a;background:#eaf1ed;padding:6px 10px;border-radius:5px;white-space:nowrap}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.photo{border:1px solid #e2e9e4;border-radius:18px;padding:0;background:#fff;overflow:hidden;text-align:left;transition:transform .2s,box-shadow .2s}.photo:hover{transform:translateY(-4px);box-shadow:0 12px 30px #24463712}.photo img{width:100%;height:230px;object-fit:cover;display:block}.photo .caption{padding:20px;position:relative}.caption small{font-size:12px;color:#7a8c85}.caption em{font-style:normal;position:absolute;right:20px;top:24px;color:#569580;font-size:23px}.exchange{margin-top:36px;border:1px solid #d9e6dc;border-radius:22px;background:#eef4ed;display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden}.exchange-copy{padding:32px 34px}.exchange h2{font-size:28px;margin:10px 0}.primary{background:#2c6455;color:white;border:0;border-radius:10px;padding:13px 22px;font-size:14px;font-weight:600}.primary:hover{background:#214d42}.secondary{background:white;border:1px solid #d6e1da;padding:12px 19px;border-radius:10px}.exchange .primary{margin-top:22px}.exchange-art{display:flex;align-items:center;justify-content:center;gap:18px;padding:28px;background:radial-gradient(ellipse at center,#fff8,transparent 75%)}.souvenir{background:#fff;padding:10px 10px 13px;border-radius:9px;width:158px;box-shadow:0 10px 24px #37534213;transform:rotate(-7deg)}.souvenir:last-child{transform:rotate(7deg)}.souvenir img{display:block;width:100%;height:130px;object-fit:cover;border-radius:5px}.souvenir span{display:block;font-size:11px;text-align:center;margin-top:10px;color:#536d62}.swap{font-size:26px;color:#719582}footer{display:flex;justify-content:space-between;padding-top:24px;font-size:12px;color:#83928b}dialog{border:1px solid #dce5de;border-radius:22px;width:min(640px,calc(100% - 28px));padding:28px;color:#233b40;max-height:90vh;overflow:auto}dialog::backdrop{background:#18392c65;backdrop-filter:blur(5px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.close{border:0;background:#f0f4f1;border-radius:50%;width:36px;height:36px;font-size:22px}.selected-photo{width:100%;height:225px;object-fit:cover;border-radius:12px}.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.style{padding:12px 5px;border:1px solid #dce5de;border-radius:9px;background:#fff;font-size:13px}.style[aria-pressed=true]{border-color:#377c64;background:#edf5ee;color:#2c6455}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.result{margin:12px auto;padding:18px;background:#f6f1e6;border:1px solid #e7e1d4;border-radius:10px;max-width:350px;text-align:center}.result img{width:100%;height:200px;object-fit:cover}.result b{display:block;font-size:22px;margin:16px 0 6px}.offers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.offer{padding:10px;background:#fff;border:1px solid #dce5de;border-radius:12px;text-align:left}.offer[aria-pressed=true]{border:2px solid #377c64;padding:9px;background:#f2f7ef}.offer img{width:100%;height:170px;object-fit:cover;border-radius:7px}.offer b,.offer small{display:block;margin:9px 4px}.offer small{color:#77877d;font-size:12px}.success{text-align:center;padding:30px 10px}.success .check{font-size:35px;color:#3c8565;margin-bottom:20px}.preview-note{font-size:11px;color:#8c998e;margin-top:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#264b3e;color:white;padding:12px 24px;border-radius:30px;font-size:13px;z-index:10;max-width:90%;text-align:center}[hidden]{display:none!important}@media(max-width:650px){header{height:65px;padding:0 22px}header b{font-size:16px}main{padding:30px 18px}h1{font-size:31px}.gallery{gap:10px}.photo img{height:150px}.photo .caption{padding:13px 10px}.caption h3{font-size:14px}.caption small{font-size:10px}.caption em{display:none}.exchange{grid-template-columns:1fr}.exchange-copy{padding:26px}.exchange-art{padding:8px 26px 30px}.section-heading{align-items:start;gap:8px}.section-heading h2{font-size:20px}.section-heading p{font-size:12px}.tag{font-size:10px}.souvenir{width:140px}.souvenir img{height:105px}footer{gap:12px;font-size:10px}.offers img{height:130px}.selected-photo{height:180px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><header><b>東京，慢慢玩。</b><small>DEMO 預覽</small></header><main>
<div class="heading"><span class="eyebrow">MAKE A LITTLE MEMORY</span><h1>回憶製造所</h1><p>把喜歡的風景，做成可以帶走的回憶。</p></div>
<section aria-labelledby="photos-title"><div class="section-heading"><div><h2 id="photos-title">從一張風景，開始創作</h2><p>選張喜歡的示範照片，試試不同的收藏方式。</p></div><span class="tag">精選 DEMO 照片</span></div>
<div class="gallery">
<button class="photo" data-photo="0"><img src="../../assets/photos/sensoji.jpg" alt="東京淺草寺"><div class="caption"><h3>淺草的午後</h3><small>東京 · 淺草寺</small><em>↗</em></div></button>
<button class="photo" data-photo="1"><img src="../../assets/photos/shibuya-crossing.jpg" alt="東京澀谷十字路口"><div class="caption"><h3>走進城市的節奏</h3><small>東京 · 澀谷</small><em>↗</em></div></button>
<button class="photo" data-photo="2"><img src="../../assets/photos/tokyo-skytree.jpg" alt="東京晴空塔"><div class="caption"><h3>抬頭遇見東京</h3><small>東京 · 晴空塔</small><em>↗</em></div></button>
</div></section>
<section class="exchange" aria-labelledby="exchange-title"><div class="exchange-copy"><span class="eyebrow">A MEMORY FOR A MEMORY</span><h2 id="exchange-title">交換一份旅行回憶</h2><p>把你的風景送給朋友，<br>也收下他眼中的另一段旅程。</p><button class="primary" id="exchange-start">與朋友交換 <span aria-hidden="true">↗</span></button></div><div class="exchange-art" aria-label="旅行收藏交換示意"><div class="souvenir"><img src="../../assets/memory/fuji-sticker.png" alt="富士山貼紙卡"><span>你的風景</span></div><span class="swap" aria-hidden="true">⇄</span><div class="souvenir"><img src="../../assets/memory/kyoto-pin-test.png" alt="京都琺瑯徽章"><span>朋友的回憶</span></div></div></section>
<footer><span>每一張風景，都值得好好留下。</span><span>創作・收藏・交換</span></footer></main>
<dialog id="create-dialog" aria-labelledby="create-title"><div class="dialog-head"><h2 id="create-title">把風景，留成收藏</h2><button class="close" aria-label="關閉">×</button></div><div id="create-options"><img class="selected-photo" id="selected-photo" alt=""><div class="styles" aria-label="收藏風格"></div><p class="preview-note">DEMO 版型預覽</p></div><div id="result" hidden></div><div class="dialog-actions"><button class="secondary" id="create-back" hidden>換個風格</button><button class="primary" id="create-action">預覽收藏</button></div></dialog>
<dialog id="exchange-dialog" aria-labelledby="exchange-dialog-title"><div class="dialog-head"><h2 id="exchange-dialog-title">想交換哪一份回憶？</h2><button class="close" aria-label="關閉">×</button></div><div id="exchange-options"><p>用一張富士山貼紙卡，交換朋友的旅行收藏。</p><div class="offers"><button class="offer" aria-pressed="true" data-offer="0"><img src="../../assets/memory/kyoto-pin-test.png" alt="京都徽章"><b>樹影下的鳥居</b><small>小宇 · 京都琺瑯徽章</small></button><button class="offer" aria-pressed="false" data-offer="1"><img src="../../assets/memory/fuji-ticket.png" alt="富士山票根"><b>富士山的藍調時刻</b><small>小庭 · 旅行票根</small></button></div><p class="preview-note">使用示範收藏體驗交換，不會傳送給真人。</p></div><div id="exchange-success" class="success" hidden><div class="check">✓</div><h2>一份風景，換一段回憶。</h2><p id="receipt"></p></div><div class="dialog-actions"><button class="primary" id="exchange-action">預覽這次交換</button></div></dialog><div class="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s);const photos=[['淺草的午後','sensoji.jpg'],['走進城市的節奏','shibuya-crossing.jpg'],['抬頭遇見東京','tokyo-skytree.jpg']];const styles=['貼紙卡','專業攝影','旅行票根','琺瑯徽章','場景積木','景點限定旅伴'];let photo=0,style=2,result=false,offer=0,stage=0;$('.styles').innerHTML=styles.map((s,i)=>`<button class="style" data-style="${i}" aria-pressed="${i===style}">${s}</button>`).join('');
function resetCreate(){result=false;$('#create-options').hidden=false;$('#result').hidden=true;$('#create-back').hidden=true;$('#create-action').textContent='預覽收藏'}
document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{photo=Number(b.dataset.photo);resetCreate();$('#selected-photo').src='../../assets/photos/'+photos[photo][1];$('#selected-photo').alt=photos[photo][0];$('#create-dialog').showModal()});
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=Number(b.dataset.style);document.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
$('#create-back').onclick=resetCreate;$('#create-action').onclick=()=>{if(result){$('#create-dialog').close();const t=$('.toast');t.textContent='已收藏這份 demo 回憶';t.hidden=false;setTimeout(()=>t.hidden=true,2500);return}result=true;$('#create-options').hidden=true;$('#result').hidden=false;$('#create-back').hidden=false;$('#result').innerHTML=`<div class="result"><small>TOKYO · A LITTLE MEMORY</small><img src="../../assets/photos/${photos[photo][1]}" alt="${photos[photo][0]}"><b>${photos[photo][0]}</b><p>${styles[style]}</p></div><p class="preview-note">風格選擇與收藏流程示意；此版以照片卡呈現。</p>`;$('#create-action').textContent='收下這份回憶'};
$('#exchange-start').onclick=()=>{stage=0;$('#exchange-options').hidden=false;$('#exchange-success').hidden=true;$('#exchange-dialog-title').textContent='想交換哪一份回憶？';$('#exchange-action').textContent='預覽這次交換';$('#exchange-dialog').showModal()};
document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>{offer=Number(b.dataset.offer);document.querySelectorAll('[data-offer]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));stage=0;$('#exchange-action').textContent='預覽這次交換'});
$('#exchange-action').onclick=()=>{if(stage===2){$('#exchange-dialog').close();return}if(stage===0){stage=1;$('#exchange-dialog-title').textContent='富士山貼紙卡 ⇄ '+(offer===0?'京都琺瑯徽章':'旅行票根');$('#exchange-action').textContent='體驗交換';return}stage=2;$('#exchange-options').hidden=true;$('#exchange-success').hidden=false;$('#exchange-dialog-title').textContent='交換完成';$('#receipt').textContent='已收到'+(offer===0?'小宇的京都琺瑯徽章':'小庭的旅行票根')+'（Demo）';$('#exchange-action').textContent='完成'};
</script></body></html>
