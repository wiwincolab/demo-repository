# 反向代理：/api 與 /health 轉給 Nitro，其餘先找預先產生的靜態檔
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://api:3000;
    }

    # 預先產生的頁面是 /trips/index.html 這種形式；找不到靜態檔的網址（首頁、404）交給 Nitro 即時產生
    location / {
        try_files $uri $uri/index.html @nitro;
    }

    location @nitro {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }
}
