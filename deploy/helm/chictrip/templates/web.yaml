apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "chictrip.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "chictrip.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        # Nginx：放預先產生的頁面與素材，並把 /api、/health 轉給 api（設定在 frontend/nginx.conf）
        - name: nginx
          image: "{{ .Values.image.web }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /trips/
              port: 80
            periodSeconds: 5
          {{- if .Values.mapData.enabled }}
          volumeMounts:
            - name: map-data-routing
              mountPath: /etc/nginx/map-data-locations
              readOnly: true
          {{- end }}
      {{- if .Values.mapData.enabled }}
      volumes:
        - name: map-data-routing
          configMap:
            name: map-data-routing
      {{- end }}
